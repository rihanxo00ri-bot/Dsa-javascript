<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        function BubbleSort(arr)
        {
              for(let i=0; i<arr.length-1;i++){
            for(let j=0; j<arr.length-1; j++){
                if(arr[j] >arr[j+1]){
                    let temp = arr[j]
                    arr[j] = arr[j+1]
                    arr[j+1] = temp
                }
            }
        }

         document.write(arr)
        }
        let data =[40, 30, 12,25,0];
       
       BubbleSort(data)
       
    </script>
</body>
</html>
