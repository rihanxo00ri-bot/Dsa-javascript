<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursion</title>
</head>
<body>
    <script>
        function recursion(x) {
            // Base Case: Stop when x drops below 1
            if (x < 1) {
                return;
            }

            console.warn(x);
            document.write(x + "<br>");

            // Recursive Case: Calls itself with a decremented value
            recursion(x - 1);
        }

        recursion(8);
    </script>
</body>
</html>
