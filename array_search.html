<body>

    <script>
function LinearSearch(arr, elem){
    for(let i = 0; i< arr.length; i++){
        if(arr[i] === elem){
            document.write(i)
            return
        }
    
    }
    
            document.write('elemnt not found')
        
}


let data = [20, 30, 2, 0 , 9, 7, 12, 90, 23, 34,49,1];
 let item = 4;

 LinearSearch(data, item)
    </script>
