<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let data = [12, 3, 4, 23, 43, 45, 89, 90, 1, 0, 16];
      let NewEl = 70;
      let position = 2;

      if (position >= 0 || position < data.length) {
      } else {
        for (let i = data.length - 1; i >= position; i--) {
          data[i + 1] = data[i];
        }
      }
      data[position] = NewEl;

      document.write(`${data}`);
    </script>
  </body>
</html>
