<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deletion of array</title>
</head>
<body>
    <script>



function ArrayDelte(data, position){
    if(position<0 || position >= data.length ||!Number.isInteger(position)){
      alert(`position does not exist ${position} ` );
      return 
      
    }

    for(let i= position; i <=data.length-1 ; i++){
        data[i] = data[i+1];
    }

    data.length = data.length-1
    for(let i = 0; i < data.length; i++){
        document.write(`${i} : ${data[i]} <br>`)
    }
}



var arr = [23, 4, 53, 2, 40, 50, 28]
var post = 4

ArrayDelte(arr, post)


    </script>
</body>
</html>
